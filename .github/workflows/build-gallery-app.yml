name: build-gallery-app

on:
  push:
    paths:
      - 'gallery-app/**'
      - '.github/workflows/build-gallery-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 署名鍵を復元
        uses: ./.github/actions/restore-key
        with:
          key: ${{ secrets.SIGN_RELEASE }}
          path: gallery-app/release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: gallery-app
        run: |
          # lib と pubspec は自作のものを守り、android/ だけ新しく作る
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --platforms=android --org com.chako --project-name gallery_app
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/keep/lib lib

      - name: Patch Android settings (permissions, background playback)
        working-directory: gallery-app
        run: |
          python3 patch_android.py
          cat android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/kotlin/com/chako/gallery_app/MainActivity.kt || true

      - name: アプリ別アイコンを生成
        continue-on-error: true
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow

      - name: Build release APK (arm64)
        working-directory: gallery-app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.${{ github.run_number }} --build-number=$((1000 + ${{ github.run_number }}))

      - name: Sign with fixed key
        working-directory: gallery-app
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.jks --ks-pass pass:galleryapp --key-pass pass:galleryapp \
            --out ../gallery-app.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs ../gallery-app.apk | head -3

      - uses: actions/upload-artifact@v4
        continue-on-error: true # 保存容量が満杯でも、リリースは作る
        with:
          name: gallery-app-apk
          path: gallery-app.apk

      - name: 更新内容を作成
        uses: ./.github/actions/release-notes
        with:
          paths: gallery-app

      - name: Publish release (latest gallery APK)
        run: cp gallery-app.apk gallery-app-v${{ github.run_number }}.apk

      - uses: ./.github/actions/publish-release
        with:
          tag: gallery-latest
          apk: gallery-app-v${{ github.run_number }}.apk
          title: 最新のギャラリーAPK
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ntfy 通知（成功）
        if: success()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: ギャラリー
          tag: gallery-latest
          status: success

      - name: ntfy 通知（失敗）
        if: failure()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: ギャラリー
          tag: gallery-latest
          status: failure

# ビルドは my-apps（公開リポジトリ）で行う
