name: build-mail-app

on:
  push:
    paths:
      - 'mail-app/**'
      - '.github/workflows/build-mail-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 署名鍵を復元
        uses: ./.github/actions/restore-key
        with:
          key: ${{ secrets.SIGN_RELEASE }}
          path: mail-app/release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mail-app
        run: |
          # lib と pubspec は自作のものを守り、android/ だけ新しく作る
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --platforms=android --org com.chako --project-name mail_app
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf lib test
          cp -r /tmp/keep/lib lib

      - name: Patch Android settings (permissions, plugin compileSdk)
        working-directory: mail-app
        run: |
          python3 patch_android.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Build release APK (arm64)
        working-directory: mail-app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.${{ github.run_number }} --build-number=$(( ($(date +%s) - 1577836800) / 10 ))

      - name: Sign with fixed key
        working-directory: mail-app
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.jks --ks-pass pass:galleryapp --key-pass pass:galleryapp \
            --out ../mail-app.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs ../mail-app.apk | head -3

      - name: 更新内容を作成
        uses: ./.github/actions/release-notes
        with:
          paths: mail-app

      - name: Publish release (latest mail APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp mail-app.apk mail-app-v${{ github.run_number }}.apk

      - uses: ./.github/actions/publish-release
        with:
          tag: mail-latest
          apk: mail-app-v${{ github.run_number }}.apk
          title: 最新のメールAPK
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ntfy 通知（成功）
        if: success()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: メーラー
          tag: mail-latest
          status: success

      - name: ntfy 通知（失敗）
        if: failure()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: メーラー
          tag: mail-latest
          status: failure

# ビルドは my-apps（公開リポジトリ）で行う
