name: build-remote-app

on:
  push:
    paths:
      - 'remote-app/**'
      - '.github/workflows/build-remote-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 署名鍵を復元
        uses: ./.github/actions/restore-key
        with:
          key: ${{ secrets.SIGN_DEBUG }}
          path: remote-app/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: remote-app
        run: gradle --no-daemon assembleRelease

      - name: 更新内容を作成
        uses: ./.github/actions/release-notes
        with:
          paths: remote-app

      - name: Publish release (latest APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp remote-app/app/build/outputs/apk/release/app-release.apk remote.apk
          cp remote.apk remote-v${{ github.run_number }}.apk

      - uses: ./.github/actions/publish-release
        with:
          tag: remote-latest
          apk: remote-v${{ github.run_number }}.apk
          title: 最新のリモコンAPK
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ntfy 通知（成功）
        if: success()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: リモコン
          tag: remote-latest
          status: success

      - name: ntfy 通知（失敗）
        if: failure()
        uses: ./.github/actions/ntfy-notify
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          app: リモコン
          tag: remote-latest
          status: failure

# ビルドは my-apps（公開リポジトリ）で行う
